<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tango assessments</title>
<style>html,body{margin:0;height:100%;background:#faf8f8;color:#2b2b2b;font:17px/1.6 system-ui,sans-serif}iframe{width:100%;height:100%;border:0}section{max-width:620px;margin:auto;padding:36px 24px}a{color:#284b63}[hidden]{display:none!important}</style>
</head>
<body>
<section id="unavailable"><h1>Listening assessments</h1><p>The assessment form is being prepared. Please check back soon.</p></section>
<iframe id="app" title="Tango recording assessment form" allow="autoplay; fullscreen" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>
<script src="./config.js"></script>
<script>
const url = window.ASSESSMENT_DEPLOYMENT_URL;
if (typeof url === 'string' && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) {
  document.getElementById('app').src = url;
  document.getElementById('app').hidden = false;
  document.getElementById('unavailable').hidden = true;
}
</script>
</body>
</html>
